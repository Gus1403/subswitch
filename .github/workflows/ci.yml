name: ci

on:
  push:
  pull_request:

jobs:
  privacy:
    name: privacy audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: audit tracked files and full history
        run: bin/audit-privacy.sh --history

  tests:
    name: tests (macOS system python)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: unit tests
        run: /usr/bin/python3 -m unittest tests/test_policy.py tests/test_subswitchd_unit.py
      - name: shim fixtures
        run: tests/test_shim.sh
      - name: LaunchAgent template renders cleanly
        run: tests/test-plist-render.sh
