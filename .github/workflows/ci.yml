name: ci

on:
  push:
  pull_request:

jobs:
  privacy:
    name: privacy audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: audit tracked files and full history
        run: bin/audit-privacy.sh --history

  tests:
    name: tests (macOS system python)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: full verification suite
        run: tests/run-all.sh
